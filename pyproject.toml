[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-games-checker"
version = "1.0.0"
description = "Desktop GUI application & background service tracking 100% free-to-keep PC games."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ziad Abdalla", email = "dazozelm23oz@users.noreply.github.com" }
]
keywords = ["gaming", "giveaways", "free-games", "pyside6", "epic-games", "steam", "gog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PySide6>=6.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "rapidfuzz>=3.0.0",
    "apscheduler>=3.10.0",
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
free-games-checker = "free_games_checker.app:main"

[tool.hatch.build.targets.wheel]
packages = ["free_games_checker"]

[tool.hatch.build.targets.wheel.force-include]
"free_games_checker/assets" = "free_games_checker/assets"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "tomlkit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=free_games_checker --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.coverage.run]
source = ["free_games_checker"]
omit = [
    "*/__main__.py",
    "*/app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
